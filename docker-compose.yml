# ==============================================================================
# docker-compose.yml: Entorno de Producción para ActuemosYaColombia
# ==============================================================================
# Orquestación para servidor VPS (1 vCPU / 1 GB RAM / 2 GB Swap - DigitalOcean)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:-}
    image: actuemosya-app:latest
    container_name: ayc-prod-app
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=/data/database.sqlite
      - APP_DOMAIN=${APP_DOMAIN:-actuemosyacolombia.org}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - ADMIN_DEFAULT_EMAIL=${ADMIN_DEFAULT_EMAIL:-cam960210@gmail.com}
      - AUTO_SEED=${AUTO_SEED:-true}
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY:-}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAILERSEND_API_KEY=${MAILERSEND_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-onboarding@resend.dev}
    volumes:
      # Persistencia de la base de datos SQLite en disco del host
      - ./data:/data
    networks:
      - ayc-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health | grep -q 'healthy' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 400M
          cpus: '0.75'
        reservations:
          memory: 150M

  caddy:
    image: caddy:2.8-alpine
    container_name: ayc-prod-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # Soporte para HTTP/3 (QUIC)
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-actuemosyacolombia.org}
      - ACME_EMAIL=${ACME_EMAIL:-cam960210@gmail.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ayc-network
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 100M
          cpus: '0.25'

volumes:
  caddy_data:
    name: ayc_prod_caddy_data
  caddy_config:
    name: ayc_prod_caddy_config

networks:
  ayc-network:
    name: ayc_prod_network
    driver: bridge
